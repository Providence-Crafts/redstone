name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The full gate, in the same pinned Nix shell as local development.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command make gate

  # The README's route without Nix on a stock Ubuntu: the distribution's SQLite,
  # then the pinned amalgamation.
  ubuntu:
    runs-on: ubuntu-22.04 # the oldest supported system SQLite (3.37)
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libsqlite3-dev sqlite3 curl unzip
      - run: make release && ./bin/redstone --version
      - run: make MODE=release run-tests
      - run: make fetch-sqlite && make SQLITE=vendored release && ./bin/redstone --version

  # The README's MSYS2 route on Windows: static exe with the vendored
  # amalgamation, then the unit tests.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            make unzip curl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sqlite3
      - run: make fetch-sqlite
      - run: make SQLITE=vendored WARNINGS_AS_ERRORS=1 release
      - run: make SQLITE=vendored MODE=release WARNINGS_AS_ERRORS=1 run-tests
      - run: ./bin/redstone.exe --version
