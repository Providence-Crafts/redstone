name: release

# Pushing a tag vX.Y.Z builds both platforms and publishes a GitHub release with
# the bare executables (redstone-X.Y.Z-linux-x86_64, redstone-X.Y.Z-windows-x86_64.exe),
# the archives (.tar.gz, .zip: executable, man page, README, LICENSE) and
# SHA256SUMS. The winget manifest under packaging/winget/ is then updated from
# the zip's SHA256 (see packaging/winget/README.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04 # older glibc, so the binary runs on more distributions
    steps:
      - uses: actions/checkout@v5
      - run: |
          make fetch-sqlite
          make SQLITE=vendored release
          v="${GITHUB_REF_NAME#v}"; d="redstone-$v-linux-x86_64"
          mkdir -p "dist/stage/$d"
          cp bin/redstone docs/redstone.1 README.md LICENSE "dist/stage/$d/"
          tar czf "dist/$d.tar.gz" -C dist/stage "$d"
          cp bin/redstone "dist/$d"
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: 'dist/redstone-*' }

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: make unzip zip curl mingw-w64-ucrt-x86_64-gcc
      - run: |
          make fetch-sqlite
          make SQLITE=vendored release
          v="${GITHUB_REF_NAME#v}"; d="redstone-$v-windows-x86_64"
          mkdir -p "dist/stage/$d"
          cp bin/redstone.exe docs/redstone.1 README.md LICENSE "dist/stage/$d/"
          (cd dist/stage && zip -qr "../$d.zip" "$d")
          cp bin/redstone.exe "dist/$d.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'dist/redstone-*' }

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - run: sha256sum redstone-* > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes redstone-* SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
